project:
  name: cmr-net
  seed: 42

output:
  isolate_by_seed: false
  run_name: welding_inference
  checkpoint_dir: checkpoints
  checkpoint_name: cmr_net_final.pt

data:
  root: data
  batch_size: 8
  num_workers: 4
  pin_memory: false
  drop_last: false
  modalities:
    - video
    - audio
    - sensor
  synthetic:
    enabled: false
  real:
    root: ${oc.env:CMR_DATA_ROOT,data/intel_robotic_welding_dataset}
    label_mode: suffix12
    max_samples: null
    scaler_fit_max_samples: 256
    train_fraction: 0.7
    val_fraction: 0.15
    split_mode: stratified_doe_cell
    min_per_class_test: 8
    process_seq_len: 32
    audio_seq_len: 48
    n_mels: 64
    video_num_frames: 8
    video_channels: 3
    video_height: 32
    video_width: 32
    default_thickness_mm: 3.0

model:
  name: cmr_net
  hidden_dim: 256
  dropout: 0.1
  d_C: 7
  d_P_obs: 6
  d_z_T: 64
  d_Z_P: 32
  d_Z_P_anchor: 16
  d_Z_A: 32
  d_Z_V: 32
  num_classes: 12
  num_families: 6
  num_risk_classes: 2
  num_heads: 4
  process_decoder_dropout: 0.1
  process_explainer_dropout: 0.1
  zp_classifier_hidden_dim: 128
  zp_classifier_dropout: 0.2
  pathway_decomposition:
    enabled: true
    replaces_main_logits: true
    inference_mediated_only: false
    mediated_use_anchor_only: false
    mediated_use_treatment_embedding: false
    mediated_hidden_dim: 128
    mediated_dropout: 0.2
    direct_condition_on_mediated: false
    direct_condition_on_context: false
    direct_condition_dropout: 0.0
    direct_hidden_dim: 128
    direct_bottleneck_dim: 32
    direct_dropout: 0.3
    direct_gate_enabled: true
    direct_gate_target: 0.1
    direct_gate_alpha_max: 0.3
    direct_gate_hidden_dim: 64
    direct_gate_init_bias: -2.0
  av_t_adversary:
    enabled: true
    subtractor_hidden_dim: 128
    adversary_hidden_dim: 128
    subtractor_dropout: 0.1
    adversary_dropout: 0.1
    init_lambda: 0.0
    detach_zp: true
    use_residual_for_direct: true

evaluation:
  results_dir: results/welding_inference
  pathway_decomposition_enabled: true
  pathway_intervention_enabled: false
  allow_test_evaluation: false

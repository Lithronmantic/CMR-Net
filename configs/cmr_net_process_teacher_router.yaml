# Round21 CMR-Net: process-teacher distillation + calibrated router diagnostics.
#
# This config is intended for server training only. It inherits the canonical
# default CMR-Net recipe and activates the process teacher. If a teacher
# checkpoint for a seed is missing, the trainer raises FileNotFoundError rather
# than silently falling back to teacher-free training.

defaults:
  - /default
  - _self_

project:
  seed: 42

data:
  synthetic:
    enabled: false
  real:
    root: ${oc.env:CMR_DATA_ROOT,data/intel_robotic_welding_dataset}
    label_mode: suffix12
    split_mode: stratified_doe_cell
    min_per_class_test: 8
  batch_size: 8
  drop_last: true
  num_workers: 8
  class_balanced_sampler: true
  class_balanced_max_weight: 16.0

model:
  pathway_decomposition:
    enabled: true
    replaces_main_logits: true
    inference_mediated_only: false
    direct_condition_on_mediated: false
    direct_condition_on_context: true
    direct_condition_dropout: 0.0
    direct_bottleneck_dim: 32
    direct_dropout: 0.3
    direct_gate_enabled: true
    direct_gate_alpha_max: 0.3
    direct_gate_target: 0.1
    direct_gate_init_bias: -2.0
  av_t_adversary:
    enabled: true
    use_residual_for_direct: true
  process_teacher:
    enabled: true
    kind: process_mini_rocket
    checkpoint_template: checkpoints/round20_baselines/process_mini_rocket/process_mini_rocket_seed{seed}.pt

training:
  epochs: 100
  stage_epochs: null
  mixed_precision: true
  deterministic: false
  run_seed: 0
  adv_t_warmup_ratio: 0.5
  av_t_adv_warmup_ratio: 0.5
  zp_classifier_dropout_start: 0.1
  zp_classifier_dropout_end: 0.3

distributed:
  enabled: true
  sync_batchnorm: false
  broadcast_buffers: true
  find_unused_parameters: false

loss:
  class_weight_mode: effective_number
  class_weight_max: 2.0
  class_weight_effective_beta: 0.999
  lambda_pobs_recon: 2.0
  lambda_zp_decorr: 0.05
  lambda_zp_residual_t_decorr: 0.1
  lambda_pobs_anchor_recon: 0.5
  lambda_zp_residual_t_adv: 1.0
  lambda_zp_residual_variance: 0.5
  lambda_zp_to_y: 0.5
  lambda_pathway_orth: 0.3
  lambda_pathway_balance: 0.15
  lambda_pathway_pred: 0.5
  pathway_orth_mode: linear_xcov
  pathway_balance_ratio_max: 4.0
  pathway_pred_weight_mediated: 1.0
  pathway_pred_weight_direct: 0.5
  lambda_audio_t_adv: 1.0
  lambda_video_t_adv: 2.0
  av_t_adv_lambda: 1.5
  lambda_direct_gate: 0.1
  lambda_direct_raw_norm: 0.01
  lambda_direct_quiet: 0.05
  direct_gate_target_mode: uncertainty
  direct_quiet_confidence_threshold: 0.7
  lambda_process_teacher_kl: 0.5
  process_teacher_temperature: 2.0
  process_teacher_warmup_ratio: 0.3

evaluation:
  results_dir: results/round21_process_teacher_router
  pathway_decomposition_enabled: true
  pathway_intervention_enabled: true
